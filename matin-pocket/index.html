<title>MATIN POCKET — فضای شخصی مدیریت زندگی</title>
<style>
:root{--navy:#14223a;--navy2:#203651;--gold:#d6b66f;--gold-light:#f8f0df;--bg:#f4f6f8;--ink:#1d2b40;--muted:#929dad;--line:#e7ebf0;--white:#fff;--green:#2b916a;--red:#c96f64;--purple:#8060b2;--blue:#456ca8}

.layout{min-height:100vh}.sidebar{position:fixed;right:0;top:0;bottom:0;width:250px;background:#101b2d;color:#eaf0f9;padding:22px 15px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:0 5px 25px;border-bottom:1px solid #ffffff14}.brand-mark{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#e5ca88,#a57a31);display:grid;place-items:center;color:#18243a;font-weight:800;font-size:20px}.brand-name{font-size:14px;direction:ltr;text-align:right;font-weight:800;letter-spacing:1px}.brand-name span{color:var(--gold)}.brand small{display:block;color:#95a4b9;font-size:10px;margin-top:4px}.nav-label{font-size:10px;color:#75859b;margin:24px 10px 9px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:right;width:100%;border:0;background:transparent;color:#a6b2c4;padding:12px;border-radius:10px;font-size:12px}.nav button:hover{background:#ffffff0d;color:white}.nav button.active{color:#f0d494;background:#d8b96c16;box-shadow:inset -3px 0 var(--gold)}.nav .count{margin-right:auto;background:#ffffff13;border-radius:5px;padding:2px 6px;font-size:10px}.sidebar-bottom{margin-top:auto}.privacy{display:flex;gap:9px;padding:12px;border:1px solid #ffffff13;background:#ffffff08;border-radius:11px;color:var(--gold);font-size:11px}.privacy small{display:block;color:#9eacc0;line-height:1.8;margin-top:5px;font-size:9px}.profile{border-top:1px solid #ffffff15;margin-top:15px;padding:15px 7px 0;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--navy);font-weight:800}.profile strong{font-size:11px}.profile small{display:block;color:#94a1b4;font-size:9px;margin-top:3px}
main{margin-right:250px;min-height:100vh}.topbar{height:74px;position:sticky;top:0;z-index:4;background:#ffffffeb;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.crumb{font-size:12px;white-space:nowrap}.crumb span{direction:ltr;display:inline-block;color:#9aa4b3;font-size:10px;margin-left:8px}.actions{display:flex;align-items:center;gap:10px}.search{display:flex;align-items:center;gap:8px;width:300px;border:1px solid var(--line);background:#f9fafb;padding:9px 11px;border-radius:9px;color:#99a4b4}.search input{width:100%;border:0;outline:0;background:transparent;font-size:11px;color:var(--ink)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:9px;padding:10px 14px;font-size:11px;font-weight:600;white-space:nowrap}.btn.primary{background:var(--navy);color:white}.btn.primary:hover{background:var(--navy2)}.btn.secondary{background:#f0f2f5;color:#4d5b70;border:1px solid #e2e6ec}.btn.gold{background:var(--gold-light);color:#8b692c}.mobile-menu,.mobile-close{display:none}
.content{max-width:1400px;margin:auto;padding:29px 30px 38px}.hero{position:relative;overflow:hidden;display:flex;align-items:center;min-height:230px;border-radius:17px;padding:30px 32px;background:linear-gradient(115deg,#14223a,#1c304b 65%,#283c56);color:white;box-shadow:0 12px 28px #14253d16}.hero .eyebrow{color:var(--gold);font-size:10px;margin-bottom:9px}.hero h1{font-size:27px;line-height:1.7;margin:0}.hero h1 span{color:#e3c47e}.hero p{font-size:11px;color:#c0ccda;margin:6px 0 16px}.date{font-size:10px;display:inline-flex;gap:7px;border:1px solid #ffffff2a;border-radius:7px;padding:7px 10px;color:#e2e8f1}.hero-art{position:absolute;left:9%;top:50%;transform:translateY(-50%);width:200px;height:200px;display:grid;place-items:center;color:var(--gold)}.orbit{position:absolute;border:1px solid #d7b56840;border-radius:50%}.orbit.one{width:170px;height:170px}.orbit.two{width:135px;height:195px;transform:rotate(37deg)}.core{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#e3c47c,#a57b36);color:var(--navy);font-size:29px;box-shadow:0 0 45px #d8b5682b;transform:rotate(-8deg)}.chip{position:absolute;width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:#243752;border:1px solid #ffffff24}.chip.a{top:20px;right:27px}.chip.b{bottom:20px;right:28px}.chip.c{left:8px;top:80px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-head h2{font-size:15px;margin:0}.section-head p{font-size:10px;color:var(--muted);margin:5px 0 0}.text-btn{border:0;background:transparent;color:#94702f;font-size:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:15px 13px;display:flex;align-items:flex-start;gap:10px;position:relative;text-align:right;min-width:0}.stat-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:17px}.blue{background:#e8eef8;color:var(--blue)}.gold-tone{background:#f8f0df;color:#a27b2d}.purple{background:#f0eafb;color:var(--purple)}.green{background:#e4f4ed;color:var(--green)}.stat-copy{display:grid;gap:4px;min-width:0}.stat-copy span{font-size:10px;color:#8d98a8}.stat-copy strong{font-size:21px}.stat-copy small{font-size:9px;color:#a6afbc;line-height:1.7}.stat .arrow{position:absolute;left:10px;top:9px;color:#b4bdc9;font-size:14px}
.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:15px}.panel{border:1px solid var(--line);background:white;border-radius:13px;padding:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panel-head h3{font-size:13px;margin:0}.panel-head p{font-size:10px;color:var(--muted);margin:5px 0 0}.link{border:0;background:transparent;color:#94702f;font-size:10px}.task-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0f2f5}.check{width:19px;height:19px;border-radius:50%;border:1px solid #d7dee8;background:white;color:transparent}.check:hover{border-color:var(--gold);color:#9c762f}.task-copy{display:grid;gap:4px;min-width:0}.task-copy strong{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-copy small{font-size:9px;color:#a0a9b6}.priority{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:auto}.priority.high{background:#e77e73}.empty-mini{text-align:center;color:#a0a9b6;font-size:11px;padding:23px 0}.add-row{width:100%;margin-top:11px;border:1px dashed #dfe3e9;background:#fbfcfd;color:#7d899b;padding:9px;border-radius:8px;font-size:10px}.add-row:hover{background:#f8f3e8;border-color:#e3cf9d}.balance-label{font-size:10px;color:#8d98a8}.balance{font-size:27px;font-weight:700;margin:8px 0 15px}.balance small{font-size:10px;color:#9ba4b1}.moneyline{display:flex;justify-content:space-between;font-size:10px;color:#8d98a8;margin:8px 0}.moneyline strong{font-size:11px}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.bar{height:5px;background:#f0f2f5;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;border-radius:10px}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.quick{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:right;min-width:0}.quick:hover{border-color:#ddc993;transform:translateY(-1px)}.quick .stat-icon{width:34px;height:34px}.quick strong{font-size:10px;display:block}.quick small{font-size:9px;color:var(--muted);display:block;margin-top:4px;line-height:1.6}.footer-note{text-align:center;color:#a2aab6;font-size:9px;margin-top:26px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}.page-head h1{font-size:25px;margin:0}.page-head p{font-size:11px;color:var(--muted);margin:7px 0 0;line-height:1.8}.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.entry{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.entry-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.entry-symbol{width:33px;height:33px;display:grid;place-items:center;background:var(--gold-light);color:#a27b2d;border-radius:9px}.entry-actions{display:flex;gap:4px}.icon-btn{border:0;background:transparent;color:#8e9aaa;border-radius:6px;padding:5px}.icon-btn:hover{background:#f0f2f5;color:#34445b}.icon-btn.delete:hover{background:#fff0ee;color:var(--red)}.entry h3{font-size:13px;margin:0;line-height:1.8;overflow-wrap:anywhere}.entry h3.done{text-decoration:line-through;color:#9ba5b3}.entry p{font-size:10px;color:#8995a5;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid #f0f2f5;margin-top:11px;padding-top:10px;font-size:9px;color:#9aa4b3}.status{margin-right:auto;border:0;border-radius:5px;padding:5px 7px;font-size:9px;background:#f7f0df;color:#9a762f}.status.done{background:#e4f4ed;color:#318767}.toolbar{display:flex;justify-content:space-between;font-size:10px;color:#9ba5b2;margin:-4px 0 14px}.empty{min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#ffffff85;border:1px dashed #dce1e8;border-radius:14px;padding:25px}.empty .symbol{font-size:25px;background:var(--gold-light);color:#a27b2d;width:53px;height:53px;border-radius:15px;display:grid;place-items:center;margin-bottom:12px}.empty h3{font-size:14px;margin:0}.empty p{font-size:10px;color:#9ba5b2;line-height:1.9;max-width:320px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.settings-grid h3{font-size:13px;margin:12px 0 6px}.settings-grid p{font-size:10px;line-height:2;color:#8995a5;margin:0 0 15px}.full{width:100%}.badge{display:inline-flex;gap:6px;align-items:center;background:#e8f5ef;color:#348a6b;padding:7px 9px;border-radius:6px;font-size:10px}.summary{display:grid;grid-template-columns:1fr auto;gap:9px;font-size:11px;color:#8d98a8}.summary strong{color:#28364c}.warning{display:flex;gap:10px;padding:14px;background:#fbf5e7;border:1px solid #f0e1bd;color:#947438;border-radius:10px;margin-top:14px;font-size:10px;line-height:1.9}.warning p{margin:0}
.backdrop{position:fixed;inset:0;background:#101b2d8c;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(4px)}.modal{width:min(490px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.field{display:grid;gap:6px;font-size:10px;color:#68768a;margin-bottom:12px}.field input,.field textarea,.field select{width:100%;border:1px solid #e0e5eb;border-radius:8px;background:#fbfcfd;padding:10px;color:#1c2a40;font-size:11px}.field textarea{resize:vertical;line-height:1.8}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #eef0f3;padding-top:15px;margin-top:5px}.toast{position:fixed;left:18px;bottom:18px;background:var(--navy);color:white;border-radius:10px;padding:12px 16px;z-index:30;font-size:11px;box-shadow:0 12px 35px #11182735}.hidden{display:none!important}
@media(max-width:1150px){.content{padding:23px 22px}.topbar{padding:0 22px}.hero-art{left:1%}.stats{gap:8px}.stat{padding:13px 10px;gap:8px}.stat-copy strong{font-size:19px}.quick{padding:10px;gap:7px}.quick small{font-size:8px}}
@media(max-width:900px){.sidebar{width:225px}main{margin-right:225px}.search{width:210px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.entries{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.sidebar{width:270px;transform:translateX(105%);transition:transform .2s;box-shadow:none}.sidebar.open{transform:translateX(0);box-shadow:-20px 0 60px #101b2d45}.scrim{position:fixed;inset:0;background:#0e182a66;z-index:4}.mobile-menu,.mobile-close{display:inline-grid;place-items:center;border:0;background:transparent;color:var(--ink);font-size:20px}.mobile-close{color:#9ba5b2;margin-right:auto}.topbar{height:64px;padding:0 12px;gap:8px}.crumb span{display:none}.actions{gap:5px}.search{width:40px;padding:9px;justify-content:center;border-color:transparent;background:transparent}.search input{width:0}.search:focus-within{width:min(180px,38vw);background:#f9fafb;border-color:var(--line)}.search:focus-within input{width:100%}.actions>.btn{font-size:0;width:37px;height:37px;padding:8px}.actions>.btn span{display:none}.content{padding:17px 12px 25px}.hero{min-height:220px;padding:23px 19px}.hero h1{font-size:23px}.hero p{max-width:245px;line-height:1.9}.hero-art{opacity:.16;left:-75px}.section-head{margin-top:22px}.stat{padding:12px 9px}.stat-copy strong{font-size:18px}.stat-copy small{white-space:normal}.stat .arrow{left:5px}.quick-grid{gap:8px}.quick{padding:9px}.quick .stat-icon{width:31px;height:31px}.quick small{line-height:1.7}.page-head{align-items:flex-start;flex-direction:column}.page-head>.btn{width:100%}.page-head h1{font-size:22px}.entries,.settings-grid{grid-template-columns:1fr}.finance-stats{grid-template-columns:1fr}.modal{padding:17px}.two{gap:7px}.footer-note{line-height:1.8}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">م</div><div><div class="brand-name">MATIN <span>POCKET</span></div><small>فضای شخصی مدیریت زندگی</small></div><button class="mobile-close" onclick="toggleNav(false)" aria-label="بستن">×</button></div>
  <div class="nav-label">فضای کاری شخصی</div>
  <nav class="nav" id="nav">
    <button class="active" data-section="dashboard">▦ <span>داشبورد</span></button>
    <button data-section="tasks">☑ <span>وظایف</span><b class="count" id="openCount">0</b></button>
    <button data-section="notes">▤ <span>یادداشت‌ها</span></button>
    <button data-section="ideas">✦ <span>ایده‌ها</span></button>
    <button data-section="documents">▧ <span>اسناد</span></button>
    <button data-section="tools">⚒ <span>ابزارآلات</span></button>
    <button data-section="finance">◉ <span>مالی</span></button>
  </nav>
  <div class="sidebar-bottom">
    <div class="privacy">♧ <div><strong>اطلاعاتت محفوظ است</strong><small>در همین مرورگر ذخیره می‌شود.</small></div></div>
    <nav class="nav" style="margin-top:12px"><button data-section="settings">⚙ <span>تنظیمات و پشتیبان</span></button></nav>
    <div class="profile"><div class="avatar">م</div><div><strong>فضای من</strong><small>استفادهٔ شخصی</small></div></div>
  </div>
</aside>
<div class="scrim hidden" id="scrim" onclick="toggleNav(false)"></div>
<main>
  <header class="topbar"><div style="display:flex;align-items:center;gap:8px"><button class="mobile-menu" onclick="toggleNav(true)" aria-label="منو">☰</button><div class="crumb"><span>MATIN POCKET</span> ‹ <b id="crumb">داشبورد</b></div></div><div class="actions"><label class="search">⌕ <input id="search" placeholder="جست‌وجو در همه‌چیز..." autocomplete="off"></label><button class="btn primary" onclick="openForm()">＋ <span>افزودن سریع</span></button></div></header>
  <div class="content" id="view"></div>
</main>
</div>
<div class="backdrop hidden" id="backdrop" onclick="if(event.target===this)closeForm()">
<form class="modal" id="entryForm">
  <div class="modal-head"><div><div style="font-size:10px;color:#9aa5b6;margin-bottom:6px" id="formEyebrow">ثبت مورد تازه</div><h2 id="formTitle">افزودن سریع</h2></div><button type="button" class="icon-btn" onclick="closeForm()">✕</button></div>
  <label class="field">نوع مورد<select id="type"><option value="notes">یادداشت</option><option value="tasks">وظیفه</option><option value="ideas">ایده</option><option value="documents">سند</option><option value="tools">ابزارآلات</option><option value="finance">ثبت مالی</option></select></label>
  <label class="field">عنوان *<input id="title" required maxlength="160" placeholder="عنوان را بنویس..."></label>
  <label class="field">توضیحات<textarea id="body" rows="3" placeholder="جزئیات یا نکته‌ها..."></textarea></label>
  <label class="field">دسته‌بندی<input id="category" placeholder="مثلاً کار، شخصی، مهم..."></label>
  <div class="two hidden" id="taskFields"><label class="field">اولویت<select id="priority"><option>متوسط</option><option>بالا</option><option>پایین</option></select></label><label class="field">مهلت انجام<input id="dueDate" type="date"></label></div>
  <div class="two hidden" id="financeFields"><label class="field">نوع ثبت<select id="direction"><option value="expense">مصرف</option><option value="income">درآمد</option></select></label><label class="field">مقدار<input id="amount" type="number" min="0" step="any" placeholder="0"></label></div>
  <div class="two hidden" id="toolFields"><label class="field">تعداد<input id="toolQuantity" type="number" min="1" step="1" value="1"></label><label class="field">وضعیت<select id="toolCondition"><option>سالم</option><option>نیازمند تعمیر</option><option>خراب</option><option>امانت‌داده‌شده</option></select></label></div>
  <div class="modal-foot"><button type="button" class="btn secondary" onclick="closeForm()">انصراف</button><button class="btn primary" type="submit">✓ ذخیره</button></div>
</form>
</div>
<div class="toast hidden" id="toast"></div>
<input class="hidden" id="importFile" type="file" accept=".json,application/json">
<script>
const KEY='matin-pocket-v1';
const labels={dashboard:'داشبورد',tasks:'وظایف',notes:'یادداشت‌ها',ideas:'ایده‌ها',documents:'اسناد',tools:'ابزارآلات',finance:'مالی',settings:'تنظیمات'};
const emptyData=()=>({tasks:[],notes:[],ideas:[],documents:[],tools:[],finance:[]});
let data=load(),section='dashboard',editing=null,toastTimer;
function load(){try{return {...emptyData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return emptyData()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notify('ذخیره‌سازی مرورگر در دسترس نیست. از پشتیبان استفاده کن.')}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(n){return new Intl.NumberFormat('fa-AF',{maximumFractionDigits:2}).format(Number(n)||0)}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2)}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2700)}
function toggleNav(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('hidden',!open)}
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{section=b.dataset.section;document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===section));toggleNav(false);render()}));
document.getElementById('search').addEventListener('input',render);
document.getElementById('type').addEventListener('change',syncFields);
function openForm(type){editing=null;document.getElementById('entryForm').reset();document.getElementById('type').value=type||(section==='dashboard'||section==='settings'?'notes':section);document.getElementById('formEyebrow').textContent='ثبت مورد تازه';document.getElementById('formTitle').textContent='افزودن سریع';syncFields();document.getElementById('backdrop').classList.remove('hidden');setTimeout(()=>document.getElementById('title').focus(),50)}
function editEntry(type,entryId){const e=data[type].find(x=>x.id===entryId);if(!e)return;editing={type,entryId};document.getElementById('entryForm').reset();document.getElementById('type').value=type;document.getElementById('title').value=e.title;document.getElementById('body').value=e.body||'';document.getElementById('category').value=e.category||'';document.getElementById('priority').value=e.priority||'متوسط';document.getElementById('dueDate').value=e.dueDate||'';document.getElementById('amount').value=e.amount??'';document.getElementById('direction').value=e.direction||'expense';document.getElementById('toolQuantity').value=e.quantity??1;document.getElementById('toolCondition').value=e.condition||'سالم';document.getElementById('formEyebrow').textContent='ویرایش مورد';document.getElementById('formTitle').textContent='تغییر اطلاعات';syncFields();document.getElementById('backdrop').classList.remove('hidden')}
function closeForm(){document.getElementById('backdrop').classList.add('hidden')}
function syncFields(){const t=document.getElementById('type').value;document.getElementById('taskFields').classList.toggle('hidden',t!=='tasks');document.getElementById('financeFields').classList.toggle('hidden',t!=='finance');document.getElementById('toolFields').classList.toggle('hidden',t!=='tools');document.getElementById('amount').required=t==='finance'}
document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();const type=document.getElementById('type').value,title=document.getElementById('title').value.trim();if(!title){notify('لطفاً عنوان را وارد کن.');return}const old=editing?data[editing.type].find(x=>x.id===editing.entryId):null;const item={id:old?.id||id(),title,body:document.getElementById('body').value.trim(),category:document.getElementById('category').value.trim(),priority:document.getElementById('priority').value,dueDate:document.getElementById('dueDate').value||'',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(type==='finance'){item.amount=Number(document.getElementById('amount').value)||0;item.direction=document.getElementById('direction').value;item.category=item.category||(item.direction==='income'?'درآمد':'مصرف')}if(type==='tools'){item.quantity=Math.max(1,Number(document.getElementById('toolQuantity').value)||1);item.condition=document.getElementById('toolCondition').value}if(editing)data[editing.type]=data[editing.type].filter(x=>x.id!==editing.entryId);data[type].unshift(item);save();closeForm();render();notify(editing?'تغییرات ذخیره شد.':'با موفقیت اضافه شد.');editing=null});
function removeEntry(type,entryId){if(!confirm('این مورد حذف شود؟'))return;data[type]=data[type].filter(x=>x.id!==entryId);save();render();notify('مورد حذف شد.')}
function toggleTask(entryId){data.tasks=data.tasks.map(t=>t.id===entryId?{...t,done:!t.done,updatedAt:new Date().toISOString()}:t);save();render()}
function allEntries(){return Object.entries(data).flatMap(([type,arr])=>arr.map(e=>({...e,type})))}
function entryCard(e,type){let icon={tasks:'☑',notes:'▤',ideas:'✦',documents:'▧',tools:'⚒',finance:'◉'}[type]||'•';return `<article class="entry"><div class="entry-top"><div class="entry-symbol">${icon}</div><div class="entry-actions"><button class="icon-btn" onclick="editEntry('${type}','${e.id}')" title="ویرایش">✎</button><button class="icon-btn delete" onclick="removeEntry('${type}','${e.id}')" title="حذف">⌫</button></div></div><h3 class="${type==='tasks'&&e.done?'done':''}">${esc(e.title)}</h3>${e.body?`<p>${esc(e.body)}</p>`:''}<div class="meta">${e.category?`<span>♧ ${esc(e.category)}</span>`:''}${type==='tasks'&&e.dueDate?`<span>▦ ${esc(e.dueDate)}</span>`:''}${type==='tools'?`<span>تعداد: ${num(e.quantity)}</span><span>وضعیت: ${esc(e.condition||'سالم')}</span>`:''}${type==='finance'?`<strong class="${e.direction==='income'?'positive':'negative'}">${e.direction==='income'?'+':'−'}${num(e.amount)}</strong>`:''}${type==='tasks'?`<button class="status ${e.done?'done':''}" onclick="toggleTask('${e.id}')">${e.done?'✓ انجام شد':'◷ باز'}</button>`:''}</div></article>`}
function empty(title,text,type){return `<div class="empty"><div class="symbol">${{tasks:'☑',notes:'▤',ideas:'✦',documents:'▧',finance:'◉'}[type]||'⌕'}</div><h3>${title}</h3><p>${text}</p><button class="btn primary" onclick="openForm('${type||'notes'}')">＋ افزودن اولین مورد</button></div>`}
function stat(label,value,note,icon,tone,go){return `<button class="stat" onclick="${go?`section='${go}';syncNav();render()`:'void(0)'}"><div class="stat-icon ${tone}">${icon}</div><div class="stat-copy"><span>${label}</span><strong>${value}</strong><small>${note}</small></div><span class="arrow">↗</span></button>`}
function syncNav(){document.getElementById('crumb').textContent=labels[section];document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===section))}
function render(){syncNav();const view=document.getElementById('view');const q=document.getElementById('search').value.trim().toLocaleLowerCase();const tasks=data.tasks.filter(x=>!x.done),done=data.tasks.length-tasks.length,inc=data.finance.filter(x=>x.direction==='income').reduce((s,x)=>s+(+x.amount||0),0),exp=data.finance.filter(x=>x.direction!=='income').reduce((s,x)=>s+(+x.amount||0),0),bal=inc-exp;
document.getElementById('openCount').textContent=num(tasks.length);
if(q){const results=allEntries().filter(e=>(e.title+' '+(e.body||'')+' '+(e.category||'')).toLocaleLowerCase().includes(q));view.innerHTML=`<div class="page-head"><div><div style="font-size:10px;color:#9aa5b6;margin-bottom:8px">جست‌وجوی یک‌جا</div><h1>نتایج جست‌وجو</h1><p>نتایج از تمام بخش‌های فضای کاری</p></div><span class="btn gold">${num(results.length)} نتیجه</span></div>${results.length?`<div class="entries">${results.map(e=>entryCard(e,e.type)).join('')}</div>`:empty('چیزی پیدا نشد','عبارت دیگری را جست‌وجو کن.','notes')}`;return}
if(section==='dashboard'){const dt=new Intl.DateTimeFormat('fa-AF',{weekday:'long',day:'numeric',month:'long'}).format(new Date());view.innerHTML=`<section class="hero"><div><div class="eyebrow">خوش آمدی به فضای خودت</div><h1>فکرهایت را منظم کن،<br><span>با تمرکز پیش برو.</span></h1><p>فضایی آرام برای مدیریت کارها، ایده‌ها و برنامه‌های روزانه‌ات.</p><span class="date">▦ ${dt}</span></div><div class="hero-art"><div class="orbit one"></div><div class="orbit two"></div><div class="core">م</div><div class="chip a">☑</div><div class="chip b">✦</div><div class="chip c">▤</div></div></section>
<div class="section-head"><div><h2>نمای کلی</h2><p>وضعیت فعلی فضای شخصی‌ات</p></div><button class="text-btn" onclick="section='settings';render()">مدیریت اطلاعات ↗</button></div>
<div class="stats">${stat('وظایف باز',num(tasks.length),num(done)+' وظیفه انجام‌شده','☑','blue','tasks')}${stat('یادداشت‌ها',num(data.notes.length),'فکرها و نکته‌های تو','▤','gold-tone','notes')}${stat('ایده‌ها',num(data.ideas.length),'ایده‌های ثبت‌شده','✦','purple','ideas')}${stat('اسناد',num(data.documents.length),'اسناد ثبت‌شده','▧','green','documents')}${stat('ابزارآلات',num(data.tools.length),'اقلام ثبت‌شده','⚒','green','tools')}</div>
<div class="columns"><section class="panel"><div class="panel-head"><div><h3>وظایف نزدیک</h3><p>کارهایی که باید پیگیری شوند</p></div><button class="link" onclick="section='tasks';render()">دیدن همه ‹</button></div>${tasks.slice(0,4).length?tasks.slice(0,4).map(t=>`<div class="task-row"><button class="check" onclick="toggleTask('${t.id}')">✓</button><div class="task-copy"><strong>${esc(t.title)}</strong><small>${t.dueDate?'مهلت: '+esc(t.dueDate):esc(t.category||'بدون مهلت')}</small></div><span class="priority ${t.priority==='بالا'?'high':''}"></span></div>`).join(''):'<div class="empty-mini">فعلاً وظیفهٔ بازی نداری. از همین‌جا شروع کن.</div>'}<button class="add-row" onclick="openForm('tasks')">＋ وظیفهٔ تازه</button></section>
<section class="panel"><div class="panel-head"><div><h3>خلاصهٔ مالی</h3><p>بر اساس ثبت‌های خودت</p></div><button class="link" onclick="section='finance';render()">جزئیات ‹</button></div><div class="balance-label">◉ تراز ثبت‌شده</div><div class="balance">${num(bal)} <small>واحد</small></div><div class="moneyline"><span>درآمد</span><strong class="positive">${num(inc)}</strong></div><div class="bar"><span style="width:${inc+exp?Math.max(3,inc/(inc+exp)*100):0}%;background:#64b797"></span></div><div class="moneyline"><span>مصارف</span><strong class="negative">${num(exp)}</strong></div><div class="bar"><span style="width:${inc+exp?Math.max(3,exp/(inc+exp)*100):0}%;background:#e4a092"></span></div><button class="add-row" onclick="openForm('finance')">＋ ثبت درآمد یا مصرف</button></section></div>
<div class="section-head"><div><h2>افزودن سریع</h2><p>هرچه در ذهن داری، ثبت کن</p></div></div><div class="quick-grid"><button class="quick" onclick="openForm('notes')"><span class="stat-icon gold-tone">▤</span><span><strong>یادداشت تازه</strong><small>ثبت یک فکر یا نکته</small></span></button><button class="quick" onclick="openForm('tasks')"><span class="stat-icon blue">☑</span><span><strong>وظیفهٔ تازه</strong><small>کاری برای انجام دادن</small></span></button><button class="quick" onclick="openForm('ideas')"><span class="stat-icon purple">✦</span><span><strong>ثبت ایده</strong><small>ایده‌ای برای بعد</small></span></button><button class="quick" onclick="openForm('documents')"><span class="stat-icon green">▧</span><span><strong>افزودن سند</strong><small>عنوان و توضیحات سند</small></span></button><button class="quick" onclick="openForm('tools')"><span class="stat-icon green">⚒</span><span><strong>ثبت ابزارآلات</strong><small>ثبت ابزار و موجودی</small></span></button></div><div class="footer-note">✧ طراحی‌شده برای استفادهٔ شخصی · اطلاعات در همین مرورگر ذخیره می‌شود.</div>`;
return}
if(section==='settings'){view.innerHTML=`<div class="page-head"><div><div style="font-size:10px;color:#9aa5b6;margin-bottom:8px">کنترول و نگهداری</div><h1>تنظیمات و پشتیبان</h1><p>اطلاعات خود را مدیریت کن و نسخهٔ پشتیبان داشته باش.</p></div></div><div class="settings-grid"><section class="panel"><div class="stat-icon gold-tone">♧</div><h3>حریم خصوصی</h3><p>اطلاعات در حافظهٔ محلی همین مرورگر ذخیره می‌شود؛ برای همگام‌سازی ابری ارسال نمی‌شود.</p><span class="badge">● ذخیره‌سازی محلی فعال</span></section><section class="panel"><div class="stat-icon gold-tone">⇩</div><h3>نسخهٔ پشتیبان</h3><p>از تمام یادداشت‌ها، وظایف، ایده‌ها، اسناد، ابزارآلات و ثبت‌های مالی فایل پشتیبان بگیر.</p><button class="btn primary full" onclick="exportData()">⇩ گرفتن نسخهٔ پشتیبان</button></section><section class="panel"><div class="stat-icon gold-tone">⇧</div><h3>بازیابی اطلاعات</h3><p>فایل پشتیبان قبلی را انتخاب کن. اطلاعات فعلی با اطلاعات فایل جایگزین می‌شود.</p><button class="btn secondary full" onclick="document.getElementById('importFile').click()">⇧ انتخاب فایل پشتیبان</button></section><section class="panel"><div class="stat-icon gold-tone">↗</div><h3>خلاصهٔ فضای کاری</h3><div class="summary"><span>وظایف</span><strong>${num(data.tasks.length)}</strong><span>یادداشت‌ها</span><strong>${num(data.notes.length)}</strong><span>ایده‌ها</span><strong>${num(data.ideas.length)}</strong><span>اسناد</span><strong>${num(data.documents.length)}</strong><span>ابزارآلات</span><strong>${num(data.tools.length)}</strong><span>ثبت‌های مالی</span><strong>${num(data.finance.length)}</strong></div></section></div><div class="warning">♧ <p><strong>نکتهٔ مهم:</strong> پاک‌کردن داده‌های مرورگر یا استفاده از دستگاه دیگر ممکن است اطلاعات را از دسترس خارج کند. مرتب نسخهٔ پشتیبان بگیر. این نسخه ورود با Face ID یا همگام‌سازی ابری ندارد.</p></div>`;return}
const arr=data[section]||[],filtered=arr.filter(e=>(e.title+' '+(e.body||'')+' '+(e.category||'')+' '+(e.condition||'')+' '+(e.quantity??'')).toLocaleLowerCase().includes(q));let desc={tasks:'کارها را ثبت کن، اولویت بده و پس از انجام علامت بزن.',notes:'یادداشت‌ها و نکته‌های مهم را یک‌جا نگه‌دار.',ideas:'ایده‌ها را پیش از فراموش‌شدن ثبت کن.',documents:'فهرست اسناد و توضیحات مربوط به آن‌ها را مرتب کن.',tools:'ابزار و وسایل خود را همراه با تعداد و وضعیت نگهداری مدیریت کن.',finance:'درآمد و مصرف‌های خود را به شکل ساده ثبت کن.'}[section];view.innerHTML=`<div class="page-head"><div><div style="font-size:10px;color:#9aa5b6;margin-bottom:8px">فضای کاری</div><h1>${labels[section]}</h1><p>${desc}</p></div><button class="btn primary" onclick="openForm('${section}')">＋ افزودن ${section==='finance'?'ثبت مالی':section==='tasks'?'وظیفه':section==='notes'?'یادداشت':section==='ideas'?'ایده':section==='tools'?'ابزار':'سند'}</button></div>${section==='finance'?`<div class="stats finance-stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px">${stat('مجموع درآمد',num(inc),'واحد پولی دلخواه','↗','green',null)}${stat('مجموع مصارف',num(exp),'واحد پولی دلخواه','◉','gold-tone',null)}${stat('تراز',num(bal),'درآمد منهای مصرف','◉','blue',null)}</div>`:''}<div class="toolbar"><span>▤ ${num(filtered.length)} مورد</span><span>ذخیره‌شده در همین مرورگر</span></div>${filtered.length?`<div class="entries">${filtered.map(e=>entryCard(e,section)).join('')}</div>`:empty('هنوز '+labels[section]+' ثبت نشده','با افزودن اولین مورد، فضای کاری خود را بساز.',section)}`}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='matin-pocket-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);notify('نسخهٔ پشتیبان آماده شد.')}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),incoming=parsed.data||parsed;if(!incoming||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.notes))throw 0;if(!confirm('اطلاعات فعلی با نسخهٔ پشتیبان جایگزین شود؟'))return;data={...emptyData(),...incoming};save();render();notify('بازیابی اطلاعات موفق بود.')}catch{notify('فایل پشتیبان معتبر نیست.')}finally{e.target.value=''}};r.readAsText(f)});
render();
</script>
</body>
</html>
